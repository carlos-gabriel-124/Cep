<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar Cep</title>
    <script src="script.js"></script>
</head>
<body>
    <!--FORMULÁRIO-->

  <br>
  <p2>Buscando endereço através do CEP:</p2><br/><br>

  <form name="form1">
      CEP : <br/>
        <input type="text" id="cep" name="cep"/><br>
        <!-- Um botão para realizar a operação buscarCep()-->
        <input type="button" value=" Buscar " onclick="buscarCep()" />
        <!--Um botão para realizar a limpeza-->
        <input type="reset" value ="Limpar" /> <br/><br/>

        Rua : <br/>
        <input type="text" id="rua" /> <br/>

        Bairro : <br/>
        <input type="text" id="bairro" /> <br/>

        Cidade : <br/>
        <input type="text" id="cidade" /> <br/>

        Estado : <br/>
        <input type="text" id="estado" /> <br/>

        Região : <br/>
        <input type="text" id="regiao" /> <br/>

        </form>



    
</body>
</html>
